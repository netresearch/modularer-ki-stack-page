name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The page is rendered from content/ + templates/ at deploy time; only the
  # assets under `public/assets/` are checked in. The build half owns checkout,
  # render and artifact upload, which keeps this workflow free of step-level
  # `uses:`.
  #
  # `include-hidden-files: true` is set on BOTH halves on purpose. Setting it
  # on the build half alone is a no-op end to end: pages-deploy.yml re-packages
  # the downloaded directory with actions/upload-pages-artifact, which tars
  # with `--exclude=.[^/]*` unless its own input is true — so `public/.nojekyll`
  # would reach the artifact and then be stripped again during Pages packaging.
  build:
    uses: netresearch/.github/.github/workflows/pages-build.yml@main
    permissions:
      contents: read
    with:
      artifact-name: github-pages-site
      artifact-path: public
      include-hidden-files: true
      # The build consumes neither PAGES_BASE_PATH nor PAGES_ORIGIN, so the
      # extra configure-pages call is not needed here. The deploy half still
      # runs configure-pages before deploying.
      configure-pages: false
      # Maturity and release version come from the organisation's aggregated
      # manifest, so the page is rendered at deploy time rather than committed.
      # scripts/build.py fails if the manifest is unreachable — a maturity table
      # built from guesses is worse than none.
      # Node is here only for the accessibility gate: axe-core needs a real
      # browser and resolved CSS, which is exactly the class of defect
      # verify_site.py cannot decide from markup.
      setup-node: true
      node-version: '22'
      build-command: >-
        python3 -m pip install --quiet jinja2 pyyaml
        && python3 scripts/build.py
        && python3 scripts/verify_site.py
        && npm ci --ignore-scripts
        && npx puppeteer browsers install chrome
        && node scripts/axe-audit.mjs public

  deploy:
    needs: build
    uses: netresearch/.github/.github/workflows/pages-deploy.yml@main
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      artifact-name: github-pages-site
      artifact-path: ./public
      include-hidden-files: true
