name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The site is fully static and checked in under `public/`, so there is no
  # generator to run — the build half exists here purely to own checkout +
  # artifact upload, which keeps this workflow free of step-level `uses:`.
  #
  # `include-hidden-files: true` is set on BOTH halves on purpose. Setting it
  # on the build half alone is a no-op end to end: pages-deploy.yml re-packages
  # the downloaded directory with actions/upload-pages-artifact, which tars
  # with `--exclude=.[^/]*` unless its own input is true — so `public/.nojekyll`
  # would reach the artifact and then be stripped again during Pages packaging.
  build:
    uses: netresearch/.github/.github/workflows/pages-build.yml@main
    permissions:
      contents: read
    with:
      artifact-name: github-pages-site
      artifact-path: public
      include-hidden-files: true
      # Static HTML: the build consumes neither PAGES_BASE_PATH nor
      # PAGES_ORIGIN, so the extra configure-pages call is not needed here.
      # The deploy half still runs configure-pages before deploying.
      configure-pages: false
      build-command: >-
        test -f public/index.html
        && test -f public/.nojekyll
        && echo "Static site checked in under public/; no build step required."

  deploy:
    needs: build
    uses: netresearch/.github/.github/workflows/pages-deploy.yml@main
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      artifact-name: github-pages-site
      artifact-path: ./public
      include-hidden-files: true
