hero:
  eyebrow: Open Source · TYPO3 · Netresearch
  title: KI in TYPO3 einführen. Mit Kontrolle über Modelle, Kosten und Zugriffe.
  lead: 'Verbinden Sie Sprachmodelle zentral, unterstützen Sie Ihre Redaktion und ergänzen Sie nur die Funktionen, die Sie brauchen. Zehn quelloffene Bausteine lassen sich passend zu Ihrem Anwendungsfall kombinieren. Die eigenständige Browser-KI beantwortet Fragen zur aufgerufenen Seite.'
  cta_business: Einführung gemeinsam planen
  cta_technical: Module und Voraussetzungen vergleichen
  cta_technical_href: '#reifegrad'
  card_title: Was Sie für den Einstieg wissen müssen
  facts:
    - title: Bestehendes TYPO3 weiterverwenden
      text: 'Die serverseitige KI-Basis unterstützt TYPO3 13.4 und 14.3. nr-repurpose setzt TYPO3 14.3 und PHP 8.3 voraus.'
    - title: Klein anfangen
      text: 'nr-llm mit nr-vault für die zentrale Anbindung. Passkeys und Backend-Agent sind zusätzliche Entscheidungen.'
    - title: Reifegrad je Modul beachten
      text: 'Von stabilen Werkzeugen bis Alpha: Status, Release und Quellbeleg stehen im Vergleich.'
stack:
  heading: Welche Aufgabe möchten Sie lösen?
  lead: 'Wählen Sie eine Aufgabe für die passenden Bausteine. Die Gruppen zeigen fachliche Zusammenhänge; zwingende technische Abhängigkeiten stehen in der Modultabelle.'
  detail_labels:
    problem: Aufgabe
    audience: Für wen
    result: Ergebnis
    stack: Zugehörige Bausteine
    open_repo: Repository öffnen
  layers:
    - number: '0'
      title: Zugänge, Secrets und HTTP-Ziele schützen
      subtitle: Schlüsselverwaltung, optionale Passkeys und kontrollierte ausgehende HTTP-Zugriffe.
      active: true
      components:
        - {label: nr-vault}
        - {label: nr-http-guard}
        - {label: Passkeys optional}
      detail:
        kicker: Sicherheit und Identität
        summary: 'nr-vault verwaltet API-Schlüssel mit Envelope-Verschlüsselung. Passkeys ergänzen passwortlose Anmeldung. nr-http-guard prüft ausgehende HTTP-Ziele im registrierten TYPO3-RequestFactory-Pfad und in gebundenen Guard-Clients.'
        problem: Schlüssel verwalten, Zugriffe begrenzen und unerlaubte HTTP-Ziele im angebundenen Client-Pfad abweisen.
        audience: Administration · IT-Sicherheit · Identity Management
        result: 'Verschlüsselte Secrets mit externem Master-Key, getrennte Anmeldung und HTTP-Zielprüfungen nach der konfigurierten Richtlinie. Die Gruppierung ist keine Abhängigkeitskette.'
        takeaway_title: Anmeldung, Berechtigungen und HTTP-Schutz trennen
        takeaway: 'Passkeys authentifizieren Menschen; TYPO3-Rechte bestimmen deren Zugriff. Passkeys sind optional für die KI-Basis; nr-passkeys-fe benötigt nr-passkeys-be. HTTP Guard sichert Vault nicht automatisch ab: Dafür ist die optionale Adapterintegration nötig. Unabhängige SDK-/Guzzle-Clients und direkte cURL-/Socket-Aufrufe liegen außerhalb seines Schutzpfads.'
        stack: [nr-vault, nr-http-guard, nr-passkeys-be, nr-passkeys-fe]
    - number: '1'
      title: Sprachmodelle zentral anbinden
      subtitle: Provider, Modelle, Budgets und serverseitige Nutzung steuern.
      components:
        - {label: nr-llm}
        - {label: Backend-Agent optional}
      detail:
        kicker: KI-Basis und Assistenz
        summary: 'nr-llm verbindet konsumierende Extensions mit konfigurierten Sprachmodellen. nr-mcp-agent ergänzt einen Assistenten im Backend und befindet sich im Alpha-Stadium.'
        problem: Provider-Zugänge und KI-Nutzung in den angeschlossenen Extensions zentral steuern.
        audience: Entwicklung · Administration · Controlling
        result: Gemeinsame Anbindung, nutzerbezogene Budgets und Auswertung für über nr-llm geführte Aufrufe.
        takeaway_title: Serverseitiger Pfad
        takeaway: 'nr-llm benötigt nr-vault. Der Backend-Agent ist optional. Schreibende Agentenwerkzeuge sind freigabepflichtig; die konkrete Tool-Auswahl und TYPO3-Rechte bleiben zu konfigurieren.'
        stack: [nr-llm, nr-mcp-agent]
    - number: '2'
      title: Redaktionelle Inhalte erstellen
      subtitle: Im Editor schreiben, Inhalte umwandeln und Landingpages vorbereiten.
      components:
        - {label: cowriter}
        - {label: nr-repurpose}
        - {label: nr-landingpage}
      detail:
        kicker: Content-Werkzeuge
        summary: 'cowriter unterstützt beim Schreiben im CKEditor. nr-repurpose erzeugt aus vorhandenen Quellen weitere Formate. nr-landingpage führt durch die Erstellung einer Landingpage.'
        problem: Vorhandene Quellen und Entwürfe in redaktionell nutzbare Inhalte überführen.
        audience: Redaktion · Marketing · CMS-Teams
        result: Drei einzeln wählbare Werkzeuge auf Basis von nr-llm; kein Backend-Agent erforderlich.
        takeaway_title: Voraussetzungen vor der Auswahl prüfen
        takeaway: 'nr-repurpose benötigt TYPO3 14.3 und PHP 8.3. Modelle müssen die benötigten Fähigkeiten unterstützen. Entwürfe und Quellen gehören vor Veröffentlichung in eine redaktionelle Prüfung.'
        stack: [cowriter, nr-repurpose, nr-landingpage]
    - number: '3'
      title: Veröffentlichung in Kanälen ergänzen
      subtitle: Eine gesondert zu planende Integration.
      components:
        - {label: Integrationsaufgabe}
      detail:
        kicker: Distribution
        summary: 'Für die Veröffentlichung in sozialen Netzwerken wird hier keine mit dem aktuellen Stack verifizierte fertige Integration angeboten.'
        problem: Freigegebene Inhalte mit passenden Formaten und Berechtigungen in Zielkanälen veröffentlichen.
        audience: Kommunikation · Marketing · Integrationsteams
        result: Ein eigener Integrationsschritt mit geprüftem Wartungsstand, TYPO3-/PHP-Kompatibilität, Kanal-API und Freigabeprozess.
        takeaway_title: Die Integrationsgrenze ist offen
        takeaway: 'Ältere Beispiele wie rx-scheduled-social, t3socials und pb_social sind keine Empfehlung für TYPO3 13.4/14.3. Ein Feed-Import ersetzt keine ausgehende Veröffentlichung.'
        stack: []
  browser:
    title: Browser-KI ist ein eigenständiger Weg
    text: 'nr-browser-ai beantwortet Fragen zur aktuellen Seite direkt auf geeigneten Geräten mit Chrome. Es benötigt weder nr-llm noch Vault oder Passkeys und führt keine zentralen Nutzungsprotokolle oder Budgets. Ein initialer Modelldownload ist erforderlich; andere Besucher erhalten die konfigurierte Ersatzansicht.'
    label: Browser-KI und ihre Grenzen ansehen
    href: https://netresearch.github.io/t3x-nr-browser-ai/de/
