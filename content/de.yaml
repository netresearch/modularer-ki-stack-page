    - {id: nr-mcp-agent, role: Backend-Assistent, boundary: 'Alpha zur kontrollierten Evaluierung; schreibende Werkzeuge benötigen Freigabe.'}
    - {id: nr-browser-ai, role: Fragen zur aktuellen Seite, boundary: 'Geeigneter Desktop-Chrome und Modelldownload; keine zentrale Protokollierung.'}
