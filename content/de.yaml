meta:
  title: Modularer KI-Stack für TYPO3 — kontrollierbar, austauschbar, schrittweise einführbar
  description: >-
    Der modulare KI-Stack von Netresearch: quelloffene TYPO3-Extensions vom Sicherheits-
    und Identitätsfundament (nr-vault, nr-passkeys) über die governance-fähige KI-Basis
    (nr-llm) bis zu Content-Produktion und Kanalausspielung — mit Reifegrad, Betriebsmodell
    und Verantwortungsgrenze je Modul.
  og_title: Modularer KI-Stack — kontrollierbar, austauschbar, schrittweise einführbar
  og_description: >-
    Sicherheit und Identität → KI-Control-Plane → Assistenz und Agenten → Content → Kanäle.
    Ein Stack, in dem jede Schicht für sich austauschbar bleibt.
  og_image_alt: Modularer KI-Stack von Netresearch

