evidence:
  limits_heading: Grenzen und offene Aufgaben
  limits:
    - 'Die Module unterstützen technische Kontrollen. Daraus folgt keine pauschale Konformität mit dem EU-KI-Gesetz, NIST AI RMF oder ISO/IEC 42001.'
    - 'Ein gemeinsames Interface garantiert keine gleichen Modellfähigkeiten oder gleichwertigen Antworten. Ein Anbieterwechsel benötigt passende Funktionen und eine fachliche Prüfung.'
    - 'Vault schützt Secrets. Fachliche Wissensquellen, Suchindizes, Datenzugriffsrechte und die Qualität von Quellen müssen gesondert eingerichtet werden.'
    - 'Es gibt hier keinen Nachweis für Einsparungen, fehlerfreie Antworten oder eine produktionsreife Social-Publishing-Integration.'
faq:
  heading: Häufige Fragen
  items:
    - q: Muss ich alle zehn Module installieren?
      a: 'Nein. nr-llm benötigt nr-vault. Backend-Agent und Content-Werkzeuge sind zusätzliche, einzeln wählbare Verbraucher von nr-llm. Passkeys und HTTP Guard sind gesonderte Entscheidungen; nr-passkeys-fe benötigt nr-passkeys-be. HTTP Guard benötigt weder Vault noch Passkeys. nr-browser-ai arbeitet unabhängig. Die Tabelle zeigt direkte Netresearch-Abhängigkeiten und Versionsvoraussetzungen.'
    - q: Schützt HTTP Guard automatisch alle ausgehenden Verbindungen?
      a: 'Nein. Nach Aktivierung erfasst nr-http-guard den registrierten TYPO3-RequestFactory-Pfad und Clients aus seinen Guard-Factories. Konfigurierte Richtlinien, Ausnahmen sowie Enforce-, Observe- oder Disabled-Modus bleiben maßgeblich. Vault wird erst durch die optionale Adapterintegration angebunden; unabhängige SDK-/Guzzle-Clients, frühe Bootstrap-Aufrufe und direkte cURL-/Socket-Aufrufe brauchen eigene Integration. Die veröffentlichte Version ist Alpha zur Evaluierung.'
    - q: Wo liegen API-Schlüssel?
      a: 'Beim lokalen Standardadapter speichert nr-vault verschlüsselte Secret-Werte und verschlüsselte Datenschlüssel in der Datenbank. Der Master-Key liegt außerhalb. Konsumierende Extensions verwenden Vault-Kennungen; es geht um die Vermeidung von Klartextschlüsseln, nicht um eine datenbankfreie Ablage.'
    - q: Gelten Budgets und Protokolle für jede KI-Nutzung?
      a: 'Für die über nr-llm angebundenen serverseitigen Aufrufe stehen Nutzerbudgets und Nutzungsaufzeichnung bereit. Diese erfassen keine unabhängigen SaaS-Werkzeuge. nr-browser-ai arbeitet lokal im Browser und führt bewusst keine zentrale Nutzungshistorie.'
    - q: Kann ich sensible Daten intern verarbeiten?
      a: 'Mit passenden selbst gehosteten Modellen ist das möglich. Prüfen Sie den gesamten Datenfluss einschließlich Rückfallkonfiguration, Werkzeugen und Wissensquellen. OpenAI-Kompatibilität ist ein Schnittstellenmerkmal und keine Zusage über den Verarbeitungsort.'
    - q: Was ist mit Veröffentlichung in sozialen Netzwerken?
      a: 'Das bleibt ein gesondertes Integrationsvorhaben. Die früher verlinkten rx-scheduled-social, t3socials und pb_social sind anhand ihrer veröffentlichten Paketvoraussetzungen keine Empfehlung für TYPO3 13.4/14.3. Wartung, aktuelle Kanal-APIs und Freigaben müssen vor einer Auswahl nachgewiesen werden.'
