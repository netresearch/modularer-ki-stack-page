hero:
  eyebrow: Open source · TYPO3 · Netresearch
  title: Introduce AI in TYPO3. Keep control of models, costs and access.
  lead: 'Connect language models centrally, support your editors and add the functions you need. Ten open-source components can be combined to suit your use case. The independent browser assistant answers questions about the current page.'
  cta_business: Plan the introduction together
  cta_technical: Compare modules and requirements
  cta_technical_href: '#reifegrad'
  card_title: What to know before starting
  facts:
    - title: Work with your existing TYPO3
      text: 'The server-side AI foundation supports TYPO3 13.4 and 14.3. nr-repurpose requires TYPO3 14.3 and PHP 8.3.'
    - title: Start with a small scope
      text: 'nr-llm with nr-vault for a shared provider connection. Passkeys and a backend agent are additional choices.'
    - title: Check maturity per module
      text: 'From stable tools to alpha: status, release and evidence are listed in the comparison.'
stack:
  heading: Which task do you want to address?
  lead: 'Select a task to see its components. These are functional groups; required technical dependencies are listed in the module table.'
  detail_labels:
    problem: Task
    audience: Audience
    result: Result
    stack: Related components
    open_repo: Open repository
  layers:
    - number: '0'
      title: Protect access, secrets and HTTP destinations
      subtitle: Credential management, optional passkeys and controlled outbound HTTP requests.
      active: true
      components:
        - {label: nr-vault}
        - {label: nr-http-guard}
        - {label: Optional passkeys}
      detail:
        kicker: Security and identity
        summary: 'nr-vault manages API keys with envelope encryption. Passkeys add passwordless sign-in. nr-http-guard checks outbound HTTP destinations on the registered TYPO3 RequestFactory path and bound guard clients.'
        problem: Manage credentials, limit access and reject disallowed HTTP destinations on the integrated client path.
        audience: Administration · IT security · Identity management
        result: 'Encrypted secrets with an external master key, separate sign-in and HTTP destination checks under the configured policy. This grouping is not a dependency chain.'
        takeaway_title: Separate sign-in, permissions and HTTP protection
        takeaway: 'Passkeys authenticate people; TYPO3 permissions define their access. Passkeys are optional for the AI foundation, but nr-passkeys-fe requires nr-passkeys-be. HTTP Guard does not automatically protect Vault: its optional adapter integration is needed. Independent SDK/Guzzle clients and direct cURL/socket calls are outside the protected path.'
        stack: [nr-vault, nr-http-guard, nr-passkeys-be, nr-passkeys-fe]
    - number: '1'
      title: Connect language models centrally
      subtitle: Manage providers, models, budgets and server-side usage.
      components:
        - {label: nr-llm}
        - {label: Optional backend agent}
      detail:
        kicker: AI foundation and assistance
        summary: 'nr-llm connects consuming extensions to configured language models. nr-mcp-agent adds a backend assistant and is at alpha maturity.'
        problem: Centrally manage provider access and AI use in connected extensions.
        audience: Development · Administration · Finance
        result: Shared provider integration, per-user budgets and analytics for calls routed through nr-llm.
        takeaway_title: The server-side path
        takeaway: 'nr-llm requires nr-vault. The backend agent is optional. Writing agent tools require approval; the available tools and TYPO3 permissions still need configuration.'
        stack: [nr-llm, nr-mcp-agent]
    - number: '2'
      title: Create editorial content
      subtitle: Write in the editor, repurpose sources and prepare landing pages.
      components:
        - {label: cowriter}
        - {label: nr-repurpose}
        - {label: nr-landingpage}
      detail:
        kicker: Content tools
        summary: 'cowriter assists writing in CKEditor. nr-repurpose turns existing sources into further formats. nr-landingpage guides the creation of a landing page.'
        problem: Turn sources and drafts into content editors can use.
        audience: Editorial · Marketing · CMS teams
        result: Three individually selectable tools built on nr-llm; no backend agent required.
        takeaway_title: Check requirements before selecting
        takeaway: 'nr-repurpose requires TYPO3 14.3 and PHP 8.3. Models must support the functions you need. Review drafts and sources before publication.'
        stack: [cowriter, nr-repurpose, nr-landingpage]
    - number: '3'
      title: Add channel publication
      subtitle: A separate integration to plan and verify.
      components:
        - {label: Integration work}
      detail:
        kicker: Distribution
        summary: 'No ready-made social publishing integration verified against the current stack is offered here.'
        problem: Publish approved content to target channels with suitable formats and permissions.
        audience: Communications · Marketing · Integration teams
        result: A separate integration with checked maintenance, TYPO3/PHP compatibility, channel API and approval process.
        takeaway_title: This integration boundary is open
        takeaway: 'Older examples such as rx-scheduled-social, t3socials and pb_social are not recommendations for TYPO3 13.4/14.3. Importing a feed does not provide outbound publication.'
        stack: []
  browser:
    title: Browser AI is an independent path
    text: 'nr-browser-ai answers questions about the current page directly on suitable devices running Chrome. It requires neither nr-llm, vault nor passkeys and has no central usage logs or budgets. An initial model download is needed; other visitors see the configured fallback.'
    label: Explore browser AI and its limits
    href: https://netresearch.github.io/t3x-nr-browser-ai/
