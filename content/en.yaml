evidence:
  limits_heading: Limits and open work
  limits:
    - 'The modules support technical controls. That does not establish blanket conformity with the EU AI Act, NIST AI RMF or ISO/IEC 42001.'
    - 'A shared interface does not guarantee equal model capabilities or equivalent answers. Switching provider requires suitable functions and a use-case evaluation.'
    - 'Vault protects credentials. Business knowledge sources, search indexes, data permissions and source quality must be configured separately.'
    - 'This page provides no evidence of savings, faultless answers or a production-ready social publishing integration.'
faq:
  heading: Frequently asked questions
  items:
    - q: Do I need all ten modules?
      a: 'No. nr-llm requires nr-vault. The backend agent and content tools are additional, individually selectable consumers of nr-llm. Passkeys and HTTP Guard are separate choices; nr-passkeys-fe requires nr-passkeys-be. HTTP Guard requires neither Vault nor passkeys. nr-browser-ai works independently. The table lists direct Netresearch dependencies and version requirements.'
    - q: Does HTTP Guard automatically protect all outbound connections?
      a: 'No. After activation, nr-http-guard covers the registered TYPO3 RequestFactory path and clients created by its guard factories. Configured policies, exceptions and enforce, observe or disabled modes still apply. Vault needs the optional adapter integration; independent SDK/Guzzle clients, early bootstrap requests and direct cURL/socket calls need their own integration. The published version is alpha for evaluation.'
    - q: Where are API keys stored?
      a: 'The local default adapter of nr-vault stores encrypted secret values and encrypted data keys in the database. The master key lives outside it. Consuming extensions use vault identifiers. The goal is to avoid plaintext keys, not database storage itself.'
    - q: Do budgets and logs cover every use of AI?
      a: 'User budgets and usage recording are available for server-side calls routed through nr-llm. They do not cover independent SaaS tools. nr-browser-ai runs locally in the browser and deliberately has no central usage history.'
    - q: Can sensitive data stay inside our environment?
      a: 'Suitable self-hosted models can support that. Review the complete data flow, including fallback configuration, tools and knowledge sources. OpenAI compatibility describes an interface, not a processing location.'
    - q: What about social network publication?
      a: 'It remains a separate integration project. Based on published package requirements, the earlier rx-scheduled-social, t3socials and pb_social examples are not recommendations for TYPO3 13.4/14.3. Verify maintenance, current channel APIs and approvals before choosing a solution.'
