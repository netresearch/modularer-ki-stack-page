meta:
  title: A modular AI stack for TYPO3 — controllable, replaceable, adoptable in steps
  description: >-
    The Netresearch modular AI stack: open-source TYPO3 extensions from the security and
    identity foundation (nr-vault, nr-passkeys) through the governable AI control plane
    (nr-llm) to content production and channel distribution — with maturity, operating model
    and responsibility boundary stated per module.
  og_title: A modular AI stack for TYPO3 — controllable, replaceable, adoptable in steps
  og_description: >-
    Security and identity → AI control plane → assistance and agents → content → channels.
    A stack in which every layer stays replaceable on its own.
  og_image_alt: The Netresearch modular AI stack

