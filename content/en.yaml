    - {id: nr-repurpose, role: Turning content into further formats, boundary: 'Alpha; requires TYPO3 14.3/PHP 8.3 and suitable model capabilities.'}
    - {id: nr-landingpage, role: Preparing landing pages, boundary: 'Beta; editorial review and approval before publication.'}
